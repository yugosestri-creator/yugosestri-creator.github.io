<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestore · Yugo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1d3d">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root { --bg: #f6f7fa; --surface: #fff; --fg: #0b1d3d; --muted: #6b7a92; --gold: #a8843c; --line: #e3e7ef; --ok: #0b7a3b; --warn: #a8843c; --err: #b03a2e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--line); z-index: 10; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .wrap img { height: 32px; width: auto; }
  .wrap h1 { font-size: 16px; margin: 0; flex: 1; letter-spacing: .04em; }
  .wrap .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  nav { display: flex; gap: 4px; max-width: 960px; margin: 0 auto; padding: 0 10px; overflow-x: auto; }
  nav button { flex: 0 0 auto; background: none; border: 0; padding: 10px 14px; font: 600 14px inherit; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
  nav button.on { color: var(--fg); border-bottom-color: var(--gold); }
  main { max-width: 960px; margin: 0 auto; padding: 16px 14px 80px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button.b { min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); font: 600 14px inherit; cursor: pointer; }
  button.b.gold { background: var(--gold); color: #fff; border-color: var(--gold); }
  button.b.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  button.b.err { background: var(--err); color: #fff; border-color: var(--err); }
  button.b:disabled { opacity: .5; cursor: default; }
  input, select { min-height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); font: 15px inherit; width: 100%; }
  textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); font: 15px/1.4 inherit; width: 100%; resize: vertical; }
  .field { display: grid; gap: 6px; margin-bottom: 10px; }
  .field label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .pin { font-weight: 700; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .tag.att { background: #fff5e0; color: var(--warn); }
  .tag.ok { background: #e5f5ec; color: var(--ok); }
  .tag.off { background: #fde7e4; color: var(--err); }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .top-right { margin-left: auto; display: flex; gap: 6px; }
  .login { max-width: 360px; margin: 60px auto; }
  .login h2 { font-size: 20px; margin: 0 0 10px; }
  .err { color: var(--err); font-size: 14px; min-height: 20px; margin: 6px 0 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .2s; z-index: 20; }
  .toast.on { opacity: .95; }
  .orari { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
  .cal .d { aspect-ratio: 1; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-weight: 600; cursor: pointer; position: relative; }
  .cal .d.empty { background: transparent; border: 0; cursor: default; }
  .cal .d.has::after { content: attr(data-n); position: absolute; top: 2px; right: 4px; background: var(--gold); color: #fff; font-size: 10px; border-radius: 999px; padding: 1px 5px; }
  .cal .h { font-weight: 700; color: var(--muted); text-align: center; padding: 4px 0; font-size: 12px; }
  .stat4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat4 div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .stat4 b { display: block; font-size: 24px; } .stat4 span { font-size: 12px; color: var(--muted); }
  .vg { display: grid; grid-template-columns: 84px 1fr 132px; gap: 8px; align-items: center; padding: 6px 4px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .vg.on { background: rgba(168,132,60,.14); }
  .vg .bar { height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; display: flex; } .vg .bar i { display: block; height: 100%; background: var(--gold); }
  /* visite: giallo = nuovi, blu = tornati */
  .vg .bar i.nuovi, .ore i.nuovi, .leg .nuovi::before { background: #e8b923; }
  .vg .bar i.tornati, .ore i.tornati, .leg .tornati::before { background: #2f7de1; }
  .vg .bar i.anonimi, .ore i.anonimi, .leg .anonimi::before { background: #8a94a6; }
  .leg { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin: 8px 0 2px; }
  .leg span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .ore > span { display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start; } .ore > span i { border-radius: 0; } .ore > span i:last-child { border-radius: 3px 3px 0 0; }
  .vg small { color: var(--muted); }
  .vg > span:last-child { text-align: right; white-space: nowrap; }
  .ore { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 120px; margin-top: 10px; }
  .ore i { display: block; background: var(--gold); position: relative; }
  .ore-l { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; font-size: 10px; color: var(--muted); text-align: center; }
  /* passati = blu */
  .card.past { border-left: 5px solid #2f7de1; background: color-mix(in srgb, #2f7de1 7%, var(--surface)); }
  .tag.blu { background: #e3eefc; color: #1d5fb8; }
  .righe { list-style: none; margin: 8px 0 0; padding: 8px 10px; background: var(--bg); border-radius: 8px; font-size: 14px; }
  .righe li { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .righe li:last-child { border-bottom: 0; }
  .righe .q { font-weight: 800; min-width: 28px; }
  .righe .n { color: var(--muted); min-width: 30px; }
  .righe .p { margin-left: auto; color: var(--muted); white-space: nowrap; }
  .nota { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: #fff5e0; color: #6b4e12; font-size: 14px; }
  .sez { margin: 18px 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cal { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal .d small { white-space: nowrap; overflow: hidden; max-width: 100%; }
  a.b { display: inline-flex; align-items: center; min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); font: 600 14px inherit; text-decoration: none; }
  .cal .d { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  .cal .d small { font-size: 10px; font-weight: 600; line-height: 1.1; color: var(--muted); }
  .cal .d.past { background: #e3eefc; border-color: #b9d3f5; color: #1d5fb8; }
  .cal .d.past.has::after { background: #2f7de1; }
  .cal .d.oggi { outline: 2px solid var(--gold); }
  .cal .d.sel { box-shadow: 0 0 0 3px var(--fg) inset; }
  /* Natan */
  .nt-stato { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .nt-stato i { width: 10px; height: 10px; border-radius: 50%; background: #8a94a6; display: inline-block; }
  .nt-stato.on i { background: #1fa45a; box-shadow: 0 0 0 4px rgba(31,164,90,.2); } .nt-stato.off i { background: var(--err); }
  .nt-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .nt-chips button { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 600 13px inherit; cursor: pointer; }
  .nt-chips button:hover { border-color: var(--gold); }
  .nt-log { display: grid; gap: 10px; margin: 10px 0; }
  #nt-q { font-family: inherit; }
  .nt-msg { padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; }
  .nt-io { background: var(--gold); color: #fff; justify-self: end; max-width: 85%; }
  .nt-bot { background: var(--surface); border: 1px solid var(--line); }
  .nt-prev { display: grid; justify-items: center; gap: 8px; margin-top: 10px; }
  .nt-prev iframe { width: 390px; max-width: 100%; height: 560px; border: 8px solid #111; border-radius: 28px; background: #03132D; }
  @media (max-width: 520px) { .stat4 { grid-template-columns: repeat(2, 1fr); } }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1326; --surface: #122144; --fg: #eef0f5; --muted: #a9b2c6; --line: rgba(255,255,255,.14); --gold: #d1a85c; }
    header { background: var(--surface); }
    .card.past { background: rgba(47,125,225,.12); } .tag.blu { background: rgba(47,125,225,.25); color: #a9cbff; }
    .cal .d.past { background: rgba(47,125,225,.22); border-color: rgba(47,125,225,.5); color: #cfe0ff; }
    .nota { background: rgba(168,132,60,.18); color: #f3dca6; }
    .tag.att { background: rgba(168,132,60,.18); } .tag.ok { background: rgba(11,122,59,.22); } .tag.off { background: rgba(176,58,46,.22); }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js?v=44"></script>
<script>
const WORKER = "https://yugo-bot.yugosestri.workers.dev";
const $ = (q) => document.querySelector(q);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast._); toast._ = setTimeout(() => t.classList.remove("on"), 2500); };
const store = { get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };

async function api(path, body) {
  const r = await fetch(WORKER + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.errore || "Errore."); e.status = r.status; throw e; }
  return d;
}

let sessione = store.get("yugo-gest", null);
let dati = { prenot: [], ordini: [], follower: [] };
let tab = "oggi";

function logout() { store.del("yugo-gest"); sessione = null; render(); }

async function carica() {
  if (!sessione) return;
  try { dati = await api("/gestore/dati", { token: sessione.token }); render(); }
  catch (e) { if (e.status === 401) { logout(); toast("Accesso scaduto. Rientra."); } else toast(e.message); }
}

let inCorso = false; // evita doppi invii se si tocca più volte lo stesso pulsante
async function azione(az, p = {}) {
  if (inCorso) return;
  inCorso = true;
  document.querySelectorAll("main button").forEach((b) => { b.disabled = true; });
  try { await api("/gestore/azione", { token: sessione.token, azione: az, ...p }); toast("Fatto"); }
  catch (e) { if (e.status === 401) { logout(); toast("Accesso scaduto."); } else toast(e.message); }
  finally { inCorso = false; await carica(); }
}

function viewLogin() {
  const err = viewLogin.err || "";
  return `
    <header><div class="wrap"><img src="logo-word.webp" alt="Yugo"><h1>Gestore</h1></div></header>
    <main><div class="login">
      <div class="card">
        <h2>🔒 Accesso riservato</h2>
        <p class="hint">Scrivi la password del gestore e il codice di 6 cifre che il bot ha pubblicato nel gruppo Telegram (è spillato in alto).</p>
        <form id="f">
          <div class="field"><label>Password</label><input type="password" id="pw" autocomplete="current-password" required></div>
          <div class="field"><label>Codice di 6 cifre (da Telegram)</label><input id="cod" inputmode="numeric" maxlength="6" required placeholder="123456"></div>
          <p class="err" id="e">${esc(err)}</p>
          <button class="b gold" type="submit" style="width:100%">Entra</button>
        </form>
      </div>
    </div></main>`;
}

function bindLogin() {
  const f = $("#f");
  $("#cod").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); });
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = $("#pw").value, cod = $("#cod").value;
    $("#e").textContent = ""; const b = f.querySelector("button"); b.disabled = true; b.textContent = "Entro…";
    try {
      const r = await api("/gestore/login", { password: pw, codice: cod });
      sessione = { token: r.token, scade: r.scade }; store.set("yugo-gest", sessione);
      carica();
    } catch (ex) { viewLogin.err = ex.message; render(); }
  });
}

function viewHome() {
  return `
    <header>
      <div class="wrap">
        <img src="logo-word.webp" alt="Yugo"><h1>Gestore</h1>
        <span class="pill">${new Date(sessione.scade).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" })}</span>
        <button class="b" id="refresh">↻</button>
        <button class="b" id="logout">Esci</button>
      </div>
      <nav>
        ${["oggi", "ordini", "coupon", "follower", "eventi", "visite", "calendario", "natan"].map((k) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${{oggi:"📅 Oggi",ordini:"🛵 Ordini",coupon:"🎁 Coupon",follower:"🔔 Follower",eventi:"🎉 Eventi",visite:"📊 Visite",calendario:"🗓 Calendario",natan:"🤖 Natan"}[k]}</button>`).join("")}
      </nav>
    </header>
    <main>${{oggi: viewOggi, ordini: viewOrdini, coupon: viewCoupon, follower: viewFollower, eventi: viewEventi, visite: viewVisite, calendario: viewCalendario, natan: viewNatan}[tab]()}</main>`;
}

function bindHome() {
  $("#refresh").onclick = carica; $("#logout").onclick = logout;
  document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { tab = b.dataset.t; render(); });
  if (tab === "oggi" || tab === "calendario") bindOggi();
  if (tab === "ordini") bindOrdini();
  if (tab === "coupon") bindCoupon();
  if (tab === "follower") bindFollower();
  if (tab === "eventi") bindEventi();
  if (tab === "natan") bindNatan();
  if (tab === "visite") document.querySelectorAll("[data-vg]").forEach((r) => r.onclick = () => { viewVisite.sel = r.dataset.vg; render(); });
}

function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fmtDay(s) { const d = new Date(s + "T00:00"); return d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }); }

const ORARI_PRENOT = (() => { const a = []; for (let m = 12 * 60; m <= 14 * 60 + 30; m += 15) a.push(fmt(m)); for (let m = 19 * 60; m <= 22 * 60 + 30; m += 15) a.push(fmt(m)); return a; function fmt(m) { return String(m / 60 | 0).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); } })();
const ORARI_ORDINE = (() => { const a = []; for (let m = 12 * 60; m <= 14 * 60; m += 15) a.push(fmt(m)); for (let m = 19 * 60; m <= 22 * 60; m += 15) a.push(fmt(m)); return a; function fmt(m) { return String(m / 60 | 0).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); } })();

function passato(data, ora) { return !!data && new Date(`${data}T${ora || "23:59"}`).getTime() < Date.now() - 15 * 60000; }
const euroG = (n) => "€ " + (+n || 0).toFixed(2).replace(".", ",");
function viewOggi() {
  const oggi = iso(new Date());
  const future = (dati.prenot || []).filter((p) => p.data >= oggi);
  const giorni = {}; future.forEach((p) => { (giorni[p.data] = giorni[p.data] || []).push(p); });
  const keys = Object.keys(giorni).sort().slice(0, 7);
  if (!keys.length) return `<div class="empty">Nessuna prenotazione nei prossimi giorni.</div>`;
  return keys.map((k) => `<h3 style="text-transform:capitalize;margin:14px 0 6px">${esc(fmtDay(k))}</h3>` + giorni[k].map(cardPrenot).join("")).join("");
}

function cardPrenot(p) {
  const off = p.stato === "annullata_ristorante", old = passato(p.data, p.ora);
  return `
    <div class="card${old ? " past" : ""}" data-p="${p.id}">
      <h3>🍽 ${esc(p.ora)} · ${esc(p.nome)}
        ${off ? '<span class="tag off">Annullata</span>' : `<span class="tag ok">${esc(p.persone)} pers.</span>`}
        ${old && !off ? '<span class="tag blu">Passata</span>' : ""}
      </h3>
      <p class="meta">${esc(p.telefono || "no telefono")}${p.email ? " · " + esc(p.email) : " · senza account"}</p>
      ${p.note ? `<p class="nota">📝 ${esc(p.note)}</p>` : ""}
      ${!off && !old ? `<div class="row">
        <button class="b" data-a="cambia">Cambia orario</button>
        <button class="b err" data-a="annulla">Annulla</button>
        ${p.telefono ? `<a class="b" href="tel:${esc(p.telefono.replace(/\s+/g,""))}">📞 Chiama</a>` : ""}
      </div>` : ""}
    </div>`;
}

function bindOggi() {
  document.querySelectorAll("[data-p]").forEach((c) => {
    const id = +c.dataset.p;
    c.querySelector('[data-a="annulla"]')?.addEventListener("click", async () => {
      if (!confirm("Annullare questa prenotazione? Il cliente riceve una notifica.")) return;
      azione("prenot-annulla", { id });
    });
    c.querySelector('[data-a="cambia"]')?.addEventListener("click", () => {
      if (c.querySelector("select")) return; // già aperto
      const sel = document.createElement("select");
      sel.innerHTML = ORARI_PRENOT.map((o) => `<option>${o}</option>`).join("");
      sel.style.margin = "8px 0";
      c.querySelector(".row").insertAdjacentElement("beforebegin", sel);
      const ok = document.createElement("button"); ok.className = "b ok"; ok.textContent = "Salva nuovo orario";
      sel.insertAdjacentElement("afterend", ok);
      ok.onclick = () => azione("prenot-cambia", { id, ora: sel.value });
    });
  });
}

const dataOrd = (o) => o.data || String(o.creato || "").slice(0, 10);
function viewOrdini() {
  const tutti = (dati.ordini || []).slice().sort((a, b) => (dataOrd(a) + (a.ora || "")).localeCompare(dataOrd(b) + (b.ora || "")));
  const prossimi = tutti.filter((o) => o.stato !== "annullata_ristorante" && !passato(dataOrd(o), o.ora));
  const vecchi = tutti.filter((o) => passato(dataOrd(o), o.ora) || o.stato === "annullata_ristorante").reverse();
  return `<h3 class="sez">Da preparare (${prossimi.length})</h3>`
    + (prossimi.length ? prossimi.map(cardOrdine).join("") : `<div class="empty" style="padding:20px">Nessun ordine da preparare.</div>`)
    + (vecchi.length ? `<h3 class="sez">🔵 Già passati · ultimi 14 giorni (${vecchi.length})</h3>` + vecchi.map(cardOrdine).join("") : "");
}
function righeOrdine(o) {
  let r = []; try { r = JSON.parse(o.righe || "[]"); } catch { r = []; }
  if (!r.length) return `<p class="meta" style="margin-top:6px">Piatti non salvati (ordine fatto prima dell'aggiornamento): vedi Telegram.</p>`;
  return `<ul class="righe">${r.map((x) => `<li><span class="q">${esc(x.q)}×</span>${x.n != null ? `<span class="n">n.${esc(x.n)}</span>` : ""}<span>${esc(x.nome)}</span><span class="p">${x.prezzo ? euroG(x.prezzo * x.q) : ""}</span></li>`).join("")}</ul>`;
}
function cardOrdine(o) {
  const d = dataOrd(o), off = o.stato === "annullata_ristorante", old = passato(d, o.ora), casa = o.modo === "consegna";
  return `
    <div class="card${old || off ? " past" : ""}" data-o="${o.id}">
      <h3>${casa ? "🛵" : "🥡"} #${o.id} · ${d && d !== iso(new Date()) ? `<span class="tag ${old ? "blu" : "att"}">${esc(fmtDay(d))}</span> ` : ""}${esc(o.ora || "")} · ${euroG(o.totale)}
        ${off ? '<span class="tag off">Annullato</span>' : old ? '<span class="tag blu">Passato</span>' : ""}</h3>
      <p class="meta"><b>${o.modo ? (casa ? "Consegna" : "Ritiro") : ""}</b>${casa && (o.indirizzo || o.zona) ? ` · 📍 ${esc(o.indirizzo || "")}${o.zona ? " (" + esc(o.zona) + ")" : ""}` : ""}</p>

/* Visite: quante volte è stato aperto il sito ogni giorno (ultimi 30 giorni) e a che ora */
function viewVisite() {
  const V = dati.visite;
  if (!V) return `<div class="empty">Statistiche non ancora disponibili. Riprova tra poco.</div>`;
  const per = {}; V.giorni.forEach((g) => per[g.giorno] = g);
  const giorno = (k) => { const g = per[k] || { giorno: k, n: 0, ore: Array(24).fill(0), prenot: 0, ordini: 0 }; g.ritorni = g.ritorni || 0; g.anonimi = g.anonimi || 0; g.oreRit = g.oreRit || Array(24).fill(0); g.oreAnon = g.oreAnon || Array(24).fill(0); return g; };
  const LEG = `<div class="leg"><span class="nuovi">Nuovi</span><span class="tornati">Tornati</span><span class="anonimi">Cookie rifiutati</span></div>`;
  const d0 = new Date(V.oggi + "T12:00");
  const lista = []; for (let i = 0; i < 30; i++) { const d = new Date(d0); d.setDate(d.getDate() - i); lista.push(giorno(iso(d))); }
  const somma = (n) => lista.slice(0, n).reduce((a, g) => a + g.n, 0);
  const max = Math.max(1, ...lista.map((g) => g.n));
  const sel = giorno(viewVisite.sel || V.oggi), maxO = Math.max(1, ...sel.ore);
  const top = sel.ore.reduce((b, n, h) => (n > sel.ore[b] ? h : b), 0);
  const corto = (k) => new Date(k + "T12:00").toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" });
  const NOMI = { it: "🇮🇹 Italiano", en: "🇬🇧 Inglese", fr: "🇫🇷 Francese", de: "🇩🇪 Tedesco", es: "🇪🇸 Spagnolo", zh: "🇨🇳 Cinese", ja: "🇯🇵 Giapponese", altro: "🌍 Altre lingue" };
  const lingue = Object.entries(V.lingue || {}).sort((a, b) => b[1] - a[1]);
  const totL = lingue.reduce((a, x) => a + x[1], 0) || 1;
  return `
    <div class="stat4">
      <div><b>${giorno(V.oggi).n}</b><span>Oggi · <span style="color:#2f7de1">${giorno(V.oggi).ritorni} tornati</span></span></div>
      <div><b>${lista[1].n}</b><span>Ieri · <span style="color:#2f7de1">${lista[1].ritorni} tornati</span></span></div>
      <div><b>${somma(7)}</b><span>Ultimi 7 giorni · <span style="color:#2f7de1">${lista.slice(0, 7).reduce((a, g) => a + g.ritorni, 0)} tornati</span></span></div>
      <div><b>${somma(30)}</b><span>Ultimi 30 giorni · <span style="color:#2f7de1">${lista.reduce((a, g) => a + g.ritorni, 0)} tornati</span></span></div>
    </div>
    <div class="card">
      <h3 style="text-transform:capitalize">🕗 ${esc(fmtDay(sel.giorno))}: ${sel.n} ${sel.n === 1 ? "visita" : "visite"}</h3>
      <p class="meta">${sel.n ? `<span style="color:#b8860b;font-weight:700">${sel.n - sel.ritorni - sel.anonimi} nuovi</span> · <span style="color:#2f7de1;font-weight:700">${sel.ritorni} tornati</span>${sel.anonimi ? ` · <span style="font-weight:700">${sel.anonimi} cookie rifiutati</span>` : ""} · Ora con più visite: <strong>${top}:00–${top + 1}:00</strong> (${sel.ore[top]}) · ` : ""}Prenotazioni: ${sel.prenot} · Ordini: ${sel.ordini}</p>
      ${LEG}
      <div class="ore">${sel.ore.map((n, h) => `<span title="${h}:00 · ${n - sel.oreRit[h] - sel.oreAnon[h]} nuovi, ${sel.oreRit[h]} tornati, ${sel.oreAnon[h]} cookie rifiutati"><i class="nuovi" style="height:${(n - sel.oreRit[h] - sel.oreAnon[h]) / maxO * 100}%"></i><i class="tornati" style="height:${sel.oreRit[h] / maxO * 100}%"></i><i class="anonimi" style="height:${sel.oreAnon[h] / maxO * 100}%"></i></span>`).join("")}</div>
      <div class="ore-l">${sel.ore.map((_, h) => `<span>${h % 3 === 0 ? h : ""}</span>`).join("")}</div>
    </div>
    <div class="card">
      <h3>📅 Visite ogni giorno</h3>
      <p class="meta">Tocca un giorno per vedere le ore. <span style="color:#b8860b;font-weight:700">Giallo = nuovi</span>, <span style="color:#2f7de1;font-weight:700">blu = tornati</span>, <span style="font-weight:700">grigio = hanno rifiutato i cookie</span> (contati lo stesso, ma non sappiamo se sono nuovi o tornati).</p>
      ${lista.map((g) => `<div class="vg ${g.giorno === sel.giorno ? "on" : ""}" data-vg="${g.giorno}">
        <span style="text-transform:capitalize">${esc(corto(g.giorno))}</span>
        <span class="bar"><i class="nuovi" style="width:${(g.n - g.ritorni - g.anonimi) / max * 100}%"></i><i class="tornati" style="width:${g.ritorni / max * 100}%"></i><i class="anonimi" style="width:${g.anonimi / max * 100}%"></i></span>
        <span><strong>${g.n}</strong>${g.prenot || g.ordini ? ` <small>· ${g.prenot} pren · ${g.ordini} ord</small>` : ""}</span>
      </div>`).join("")}
    </div>
    ${lingue.length ? `<div class="card"><h3>🌍 Lingua dei visitatori (30 giorni)</h3>
      ${lingue.map(([l, n]) => `<div class="vg" style="cursor:default"><span>${esc(NOMI[l] || l)}</span><span class="bar"><i style="width:${Math.round(n / totL * 100)}%"></i></span><span><strong>${n}</strong></span></div>`).join("")}</div>` : ""}
    <p class="hint">Contiamo ogni volta che qualcuno apre il sito: in giallo la prima volta di un telefono, in blu tutte le volte dopo. Senza nomi e senza IP. I dati delle visite si cancellano da soli dopo 30 giorni; gli ordini da casa dopo 14 giorni.</p>`;
}

function viewCalendario() {
  const d = viewCalendario.d || new Date();
  const anno = d.getFullYear(), mese = d.getMonth();
  const primo = new Date(anno, mese, 1), ultimo = new Date(anno, mese + 1, 0);
  const start = (primo.getDay() + 6) % 7; // lun = 0
  const nomeMese = d.toLocaleDateString("it-IT", { month: "long", year: "numeric" });
  const giorni = {};
  (dati.prenot || []).forEach((p) => { if (p.stato === "annullata_ristorante") return; const g = (giorni[p.data] = giorni[p.data] || { p: 0, o: 0 }); g.p++; });
  (dati.ordini || []).forEach((o) => { if (o.stato === "annullata_ristorante") return; const k = dataOrd(o); const g = (giorni[k] = giorni[k] || { p: 0, o: 0 }); g.o++; });
  const oggi = iso(new Date());
  const cells = [];
  for (let i = 0; i < start; i++) cells.push(`<div class="d empty"></div>`);
  for (let n = 1; n <= ultimo.getDate(); n++) {
    const k = `${anno}-${String(mese + 1).padStart(2, "0")}-${String(n).padStart(2, "0")}`;
    const g = giorni[k] || { p: 0, o: 0 }, q = g.p + g.o;
    cells.push(`<div class="d${q ? " has" : ""}${k < oggi ? " past" : ""}${k === oggi ? " oggi" : ""}${k === viewCalendario.sel ? " sel" : ""}" data-d="${k}" data-n="${q}">${n}${q ? `<small>${g.p ? "🍽" + g.p : ""}${g.p && g.o ? " " : ""}${g.o ? "🛵" + g.o : ""}</small>` : ""}</div>`);
  }
  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <button class="b" id="prev">←</button>
      <strong style="text-transform:capitalize">${esc(nomeMese)}</strong>
      <button class="b" id="next">→</button>
    </div>
    <div class="cal">
      ${["L","M","M","G","V","S","D"].map((h) => `<div class="h">${h}</div>`).join("")}
      ${cells.join("")}
    </div>
    <p class="hint">🍽 prenotazioni · 🛵 ordini · in <b style="color:#2f7de1">blu</b> i giorni e gli ordini già passati.</p>
    <div id="cal-day" style="margin-top:12px"></div>
  </div>`;
}

function bindCalendario() {
  $("#prev").onclick = () => { const d = viewCalendario.d || new Date(); d.setMonth(d.getMonth() - 1); viewCalendario.d = d; render(); };
  $("#next").onclick = () => { const d = viewCalendario.d || new Date(); d.setMonth(d.getMonth() + 1); viewCalendario.d = d; render(); };
  const apri = (k) => {
    const pr = (dati.prenot || []).filter((p) => p.data === k).sort((a, b) => (a.ora || "").localeCompare(b.ora || ""));
    const or = (dati.ordini || []).filter((o) => dataOrd(o) === k).sort((a, b) => (a.ora || "").localeCompare(b.ora || ""));
    document.querySelectorAll(".cal .d").forEach((x) => x.classList.toggle("sel", x.dataset.d === k));
    $("#cal-day").innerHTML = `<h3 style="text-transform:capitalize">${esc(fmtDay(k))}</h3>`
      + (pr.length ? `<h3 class="sez">🍽 Prenotazioni (${pr.length})</h3>` + pr.map(cardPrenot).join("") : "")
      + (or.length ? `<h3 class="sez">🛵 Ordini (${or.length})</h3>` + or.map(cardOrdine).join("") : "")
      + (!pr.length && !or.length ? `<p class="meta">Niente in questo giorno.</p>` : "");
    bindOggi(); bindOrdini();
  };
  document.querySelectorAll(".cal .d[data-d]").forEach((e) => e.onclick = () => { viewCalendario.sel = e.dataset.d; apri(e.dataset.d); });
  if (viewCalendario.sel) apri(viewCalendario.sel);
}

/* ---------- 🤖 Natan: il tuo Natan del Mac come consulente del ristorante ----------
   Funziona solo quando Natan è acceso sul Mac. L'indirizzo del Mac (cambia a ogni avvio) si legge da ponte.json
   sul sito di Natan. Serve un codice amico creato in Natan (lo scrivi qui una volta, resta solo su questo telefono).
   A Natan mandiamo solo numeri e informazioni del sito: mai nomi, telefoni o indirizzi dei clienti. */
const NT_PONTE = "https://kacr268698-pixel.github.io/natan/ponte.json";
const NT = { url: "", stato: "?", log: store.get("yugo-natan-log", []), lavoro: false, prev: null };
const NT_IDEE = [
  "Analizza visite, ordini e prenotazioni e dimmi cosa va bene e cosa no",

  "Idee per fare pubblicità questa settimana a Sestri Levante",

  "Proponi un evento o una promo per riempire i giorni più vuoti"
];
async function ntTrova() {
  NT.stato = "cerco"; ntStato();
  const prova = async (u) => { try { const r = await fetch(u + "/ping", { cache: "no-store" }); const d = await r.json(); return d && d.app === "natan" ? u : ""; } catch { return ""; } };
  let url = await prova("http://127.0.0.1:8765");   // se il Gestore è aperto sul Mac stesso
  if (!url) {
    try { const p = await (await fetch(NT_PONTE + "?t=" + Date.now(), { cache: "no-store" })).json(); if (p.url) url = await prova(String(p.url).replace(/\/$/, "")); } catch { /* niente */ }
  }
  NT.url = url; NT.stato = url ? "on" : "off"; ntStato();
}
function ntStato() {
  const el = $("#nt-stato"); if (!el) return;
  el.className = "nt-stato " + (NT.stato === "on" ? "on" : NT.stato === "off" ? "off" : "");
  el.innerHTML = `<i></i>${NT.stato === "on" ? "Natan è acceso sul Mac" : NT.stato === "off" ? "Natan è spento: accendi il Mac e apri Natan" : "Cerco Natan…"}`;
  const b = $("#nt-invia"); if (b) b.disabled = NT.stato !== "on" || NT.lavoro || !store.get("yugo-natan-codice", "");
}
/* Tutto quello che Natan deve sapere, in poche righe (massimo ~4000 caratteri) */
function ntContesto() {
  const R = (window.YUGO_CONFIG || {}).ristorante || {}, r = [], fatti = [], oggi = iso(new Date());
  r.push(`RISTORANTE: ${R.nome || "Yugo"} (${R.slogan || ""}), sushi a ${R.citta || "Sestri Levante"}, ${R.indirizzo || ""}. Social: TikTok @${(R.social || {}).tiktok || "-"}, Instagram @${(R.social || {}).instagram || "-"}.`);
  r.push(`Orari: ${(R.orari || []).map((o) => `${o.giorno.slice(0, 3)} ${o.ore}`).join("; ")}.`);
  if (R.allYouCanEat) r.push(`All you can eat: cena € ${R.allYouCanEat.prezzo}${R.allYouCanEatPranzo ? `, pranzo € ${R.allYouCanEatPranzo.prezzo} (weekend € ${R.allYouCanEatPranzo.prezzoWeekend || R.allYouCanEatPranzo.prezzo})` : ""}.`);
  if (R.formule) r.push(`Menu asporto: ${R.formule.map((f) => `${f.nome} € ${f.prezzo} (${f.quando})`).join("; ")}.`);
  if (R.ordini) r.push(`Consegna: zone ${(R.ordini.zone || []).map((z) => `${z.nome} € ${z.costo}`).join(", ")}; minimo € ${R.ordini.minimo}; anche su Just Eat.`);
  const cats = (R.menu || []).map((c) => { const p = c.piatti.map((x) => x.prezzo).filter((x) => x != null); return `${c.categoria} (${c.piatti.length} piatti, € ${Math.min(...p)}–${Math.max(...p)})`; });
  r.push(`Menu: ${cats.join("; ")}.`);
  r.push("SITO: pagine Home (offerte, social, invita amici), Menu (asporto o al ristorante, filtri, quiz «Non sai cosa prendere?»), Ordina (asporto/consegna senza account, si paga alla consegna), Prenota (nome e telefono, pulsanti giorno e ora), Account (ordini, carta fedeltà, invita amici con codice sconto), assistente Natan a pulsanti. 7 lingue. Si installa come app. Foto dei piatti: quasi nessuna (solo 1).");
  const ev = (dati.eventi || []).map((e) => `${e.nome} ${e.dal}→${e.al}${e.sconto ? " sconto " + e.sconto : ""}`);
  r.push(`Eventi/offerte attive: ${ev.length ? ev.join(" | ") : "nessuna"}.`);
  const V = dati.visite;
  if (V) {
    const per = {}; V.giorni.forEach((g) => per[g.giorno] = g);
    const giorni = []; for (let i = 13; i >= 0; i--) { const d = new Date(V.oggi + "T12:00"); d.setDate(d.getDate() - i); const k = iso(d), g = per[k] || { n: 0, ritorni: 0, prenot: 0, ordini: 0 };
      giorni.push(`${d.toLocaleDateString("it-IT", { weekday: "short", day: "numeric" })}: ${g.n} visite (${g.ritorni || 0} tornati), ${g.prenot || 0} pren, ${g.ordini || 0} ord`); }
    r.push(`VISITE AL SITO ultimi 14 giorni: ${giorni.join("; ")}.`);
    const g14 = []; for (let i = 0; i < 14; i++) { const d = new Date(V.oggi + "T12:00"); d.setDate(d.getDate() - i); g14.push(per[iso(d)] || { n: 0, ritorni: 0, prenot: 0, ordini: 0 }); }
    const tv = g14.reduce((a, g) => a + g.n, 0), tr = g14.reduce((a, g) => a + (g.ritorni || 0), 0), az = g14.reduce((a, g) => a + (g.prenot || 0) + (g.ordini || 0), 0);
    fatti.push(`In 14 giorni ${tv} visite (media ${(tv / 14).toFixed(1)} al giorno), ${g14.filter((g) => !g.n).length} giorni con zero visite, ${tv ? Math.round(tr / tv * 100) : 0}% sono persone che tornano.`);
    fatti.push(`Su ${tv} visite, ${az} sono diventate un ordine o una prenotazione (${tv ? (az / tv * 100).toFixed(1) : 0}%).`);
    const ore = Array(24).fill(0); V.giorni.forEach((g) => (g.ore || []).forEach((n, h) => ore[h] += n));
    r.push(`Ore con più visite (30 giorni): ${ore.map((n, h) => [h, n]).filter(([, n]) => n).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([h, n]) => `${h}:00 (${n})`).join(", ")}. Lingue: ${Object.entries(V.lingue || {}).map(([l, n]) => `${l} ${n}`).join(", ") || "-"}.`);
  }
  const ord = (dati.ordini || []).filter((o) => o.stato !== "annullata_ristorante");
  if (ord.length) {
    const piatti = {}; let tot = 0, cons = 0;
    ord.forEach((o) => { tot += +o.totale || 0; if (o.modo === "consegna") cons++; try { JSON.parse(o.righe || "[]").forEach((x) => piatti[x.nome] = (piatti[x.nome] || 0) + (+x.q || 1)); } catch { /* ok */ } });
    fatti.push(`Ordini dal sito: ${ord.length}, scontrino medio € ${(tot / ord.length).toFixed(1)}.`);
    r.push(`ORDINI DAL SITO (ultimi 14 giorni e prossimi): ${ord.length} ordini, totale € ${tot.toFixed(0)}, media € ${(tot / ord.length).toFixed(1)}, ${cons} consegne e ${ord.length - cons} ritiri. Piatti più ordinati: ${Object.entries(piatti).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([n, q]) => `${n} ×${q}`).join(", ")}.`);
  } else { r.push("ORDINI DAL SITO: nessuno negli ultimi 14 giorni."); fatti.push("Nessun ordine dal sito in 14 giorni."); }
  const pr = (dati.prenot || []).filter((p) => p.stato === "confermata");
  if (pr.length) {
    const gs = {}; pr.forEach((p) => { const g = new Date(p.data + "T12:00").toLocaleDateString("it-IT", { weekday: "short" }); gs[g] = (gs[g] || 0) + 1; });
    r.push(`PRENOTAZIONI DAL SITO: ${pr.length} (${pr.filter((p) => p.data >= oggi).length} future), media ${(pr.reduce((a, p) => a + (+p.persone || 0), 0) / pr.length).toFixed(1)} persone. Per giorno: ${Object.entries(gs).map(([g, n]) => `${g} ${n}`).join(", ")}.`);
    fatti.push(`Prenotazioni dal sito: ${pr.length}.`);
  } else { r.push("PRENOTAZIONI DAL SITO: nessuna negli ultimi 14 giorni."); fatti.push("Nessuna prenotazione dal sito in 14 giorni."); }
  return ("NUMERI CHIAVE (già calcolati, usali):\n- " + fatti.join("\n- ") + "\n\n" + r.join("\n")).slice(0, 5000);
}
const NT_ISTRUZIONI = `Sei Natan e fai il consulente di marketing per Yugo, il ristorante di sushi di Kevin a Sestri Levante. Kevin ti manda i dati veri del ristorante e del sito (visite, ordini, prenotazioni, menu, offerte) e una domanda.
Regole:
- Rispondi solo alla DOMANDA DI KEVIN, in italiano semplice e corretto. Non ripetere risposte precedenti.
- Usa i numeri: ogni punto deve citare un dato (es. «solo 3 visite al giorno», «0 ordini dal sito»). Se i dati sono pochi, dillo.
- Non inventare cose che non sono nei dati: non vedi la grafica del sito, quindi non parlare di font, colori o logo se Kevin non lo chiede.
- Consigli concreti e realistici per un piccolo ristorante con poco budget: Instagram, TikTok, profilo Google Maps e recensioni, QR sui tavoli e sugli scontrini, volantini, collaborazioni con hotel e negozi, eventi. Per ogni consiglio scrivi cosa fare, quando e quanto costa più o meno.
- Per un'analisi usa questo schema: «Cosa va bene» (2–3 punti), «Cosa non va» (2–3 punti), «Cosa fare questa settimana» (3 azioni numerate).
- Se proponi una modifica visibile al sito, aggiungi alla fine UN blocco \`\`\`html con solo il pezzo di pagina nuovo (niente script, niente immagini), usando le classi del sito: card, btn btn-gold, btn, muted, offerte-tit.`;

function viewNatan() {
  const cod = store.get("yugo-natan-codice", "");
  const ultima = NT.log.length ? NT.log[NT.log.length - 1] : null;
  return `
    <div class="card">
      <h3>🤖 Natan, il tuo consulente</h3>
      <p class="nt-stato" id="nt-stato"></p>
      <p class="hint">Funziona solo quando il Mac è acceso con Natan aperto. Natan legge visite, ordini, prenotazioni, menu e offerte e ti dà idee per il sito e la pubblicità. Gli mandiamo solo numeri: mai nomi, telefoni o indirizzi dei clienti.</p>
      ${cod ? `<div class="row"><button class="b" id="nt-cod-x">Cambia codice di Natan</button><button class="b" id="nt-riprova">↻ Ricontrolla</button>${NT.log.length ? `<button class="b" id="nt-nuova">🧹 Nuova conversazione</button>` : ""}</div>` : `
      <form id="nt-cod-f" style="margin-top:10px">
        <div class="field"><label>Codice di Natan (una volta sola)</label><input type="password" id="nt-cod" autocomplete="off" required placeholder="Incolla qui il codice"></div>
        <p class="hint">Sul Mac apri Natan → pagina Amici → aggiungi un amico chiamato «Yugo»: Natan copia il messaggio di invito. Incollalo qui così com'è (prendo io il codice dal link). Resta salvato solo su questo telefono; da Natan puoi revocarlo quando vuoi.</p>
        <button class="b gold" type="submit">Salva</button>
      </form>`}
    </div>
    ${cod ? `
    <div class="nt-log" id="nt-log">${NT.log.map((m, i) => `<div class="nt-msg ${m.io ? "nt-io" : "nt-bot"}">${esc(m.io ? m.testo : m.testo.replace(/```html[\s\S]*?(```|$)/i, "🎨 (proposta grafica: guarda l'anteprima)"))}${!m.io && /\`\`\`html/i.test(m.testo) ? `<div class="row"><button class="b gold" data-prev="${i}">👁 Anteprima sul telefono</button></div>` : ""}</div>`).join("")}</div>
    ${NT.prev != null ? `<div class="card nt-prev"><h3>👁 Anteprima (come apparirebbe nel sito)</h3><iframe id="nt-frame" sandbox title="Anteprima"></iframe><p class="hint">È solo un'anteprima: per metterla davvero nel sito passala a Claude.</p><button class="b" id="nt-prev-x">Chiudi anteprima</button></div>` : ""}
    <div class="card">
      <div class="nt-chips">${NT_IDEE.map((t) => `<button type="button" data-idea>${esc(t)}</button>`).join("")}</div>
      <form id="nt-f">
        <div class="field"><textarea id="nt-q" rows="3" maxlength="1200" placeholder="Chiedi qualcosa a Natan…"></textarea></div>
        <button class="b gold" id="nt-invia" type="submit" style="width:100%">${NT.lavoro ? "Natan sta pensando…" : "Chiedi a Natan"}</button>
      </form>
    </div>` : ""}`;
}
function bindNatan() {
  ntStato(); if (NT.stato === "?" || NT.stato === "off") ntTrova();
  $("#nt-cod-f")?.addEventListener("submit", (e) => { e.preventDefault(); const raw = $("#nt-cod").value.trim(), v = ((raw.match(/codice=([A-Za-z0-9_-]+)/) || [])[1] || raw).trim(); if (v) { store.set("yugo-natan-codice", v); render(); } });
  $("#nt-cod-x")?.addEventListener("click", () => { if (confirm("Vuoi cambiare il codice di Natan?")) { store.del("yugo-natan-codice"); render(); } });
  $("#nt-riprova")?.addEventListener("click", ntTrova);
  $("#nt-nuova")?.addEventListener("click", () => { NT.log = []; NT.prev = null; store.set("yugo-natan-log", []); render(); });
  $("#nt-prev-x")?.addEventListener("click", () => { NT.prev = null; render(); });
  document.querySelectorAll("[data-idea]").forEach((b) => b.onclick = () => { $("#nt-q").value = b.textContent; $("#nt-q").focus(); });
  document.querySelectorAll("[data-prev]").forEach((b) => b.onclick = () => { NT.prev = +b.dataset.prev; render(); $("#nt-frame")?.scrollIntoView({ behavior: "smooth" }); });
  $("#nt-f")?.addEventListener("submit", (e) => { e.preventDefault(); ntChiedi($("#nt-q").value); });
  const fr = $("#nt-frame");
  if (fr && NT.log[NT.prev]) {
    const m = NT.log[NT.prev].testo.match(/```html\s*([\s\S]*?)(```|$)/i);
    const pezzo = (m ? m[1] : "").replace(/<script[\s\S]*?<\/script>/gi, "");
    const base = location.href.replace(/[^/]*$/, "");
    fr.srcdoc = `<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="${base}style.css"><style>body{background:var(--bg);color:var(--fg);padding:16px;margin:0}</style></head><body><main class="view">${pezzo}</main></body></html>`;
  }
  const log = $("#nt-log"); if (log && NT.lavoro) log.lastElementChild?.scrollIntoView({ block: "end" });
}
async function ntChiedi(domanda) {
  domanda = String(domanda || "").trim(); const cod = store.get("yugo-natan-codice", "");
  if (!domanda || NT.lavoro || !cod) return;
  if (NT.stato !== "on") { toast("Natan è spento: accendi il Mac."); return; }
  NT.lavoro = true; NT.log.push({ io: true, testo: domanda }, { testo: "…" }); render();
  const bot = NT.log[NT.log.length - 1];
  const H = { "Authorization": "Bearer " + cod, "Content-Type": "application/json" };
  const agg = () => { const el = document.querySelectorAll("#nt-log .nt-msg"); const x = el[el.length - 1]; if (x && tab === "natan") x.textContent = bot.testo.replace(/```html[\s\S]*?(```|$)/i, "🎨 (sto preparando l'anteprima…)"); };
  try {
    const storia = NT.log.slice(0, -2).filter((m) => m.testo && !/^⚠️|non sono sicuro di rispondere/.test(m.testo)).slice(-2).map((m) => ({ ruolo: m.io ? "io" : "natan", testo: m.testo.slice(0, 1500) }));
    const testo = `DATI DI YUGO (aggiornati ${new Date().toLocaleString("it-IT")}):\n${ntContesto()}\n\nDOMANDA DI KEVIN: ${domanda}`;
    const r = await fetch(NT.url + "/consulente", { method: "POST", headers: H, body: JSON.stringify({ sistema: NT_ISTRUZIONI, testo, storia }) });
    if (r.status === 404) throw new Error("Il Natan del Mac non ha ancora il «consulente»: chiudi Natan e riaprilo (Natan.command sul Desktop), poi riprova.");
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) throw new Error("Il codice di Natan non è valido: creane uno nuovo in Natan.");
    if (!r.ok || !d.job) throw new Error(d.error || "Natan non ha risposto.");
    const fine = Date.now() + 10 * 60000;
    while (Date.now() < fine) {
      await new Promise((ok) => setTimeout(ok, 1500));
      const j = await (await fetch(NT.url + "/job?id=" + encodeURIComponent(d.job), { headers: { "Authorization": "Bearer " + cod }, cache: "no-store" })).json().catch(() => ({}));
      if (j.text) { bot.testo = j.text; agg(); }
      if (j.error) throw new Error(j.error);
      if (j.done) break;
    }
    if (!bot.testo || bot.testo === "…") bot.testo = "Natan non ha risposto in tempo. Riprova.";
  } catch (e) {
    bot.testo = "⚠️ " + (e && e.message && !/fetch|network|load/i.test(e.message) ? e.message : "Non riesco a parlare con Natan. Il Mac è acceso?");
    if (/fetch|network|load/i.test(e && e.message || "")) { NT.stato = "off"; }
  }
  NT.lavoro = false; NT.log = NT.log.slice(-20); store.set("yugo-natan-log", NT.log); render();
}
